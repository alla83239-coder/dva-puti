<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07170f"/><stop offset=".42" stop-color="#163c2b"/><stop offset="1" stop-color="#07150f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e2bd69" stop-opacity=".72"/><stop offset=".24" stop-color="#c8a457" stop-opacity=".3"/><stop offset="1" stop-color="#c8a457" stop-opacity="0"/></radialGradient>
 <linearGradient id="trunk" x2="1"><stop stop-color="#06130d"/><stop offset=".45" stop-color="#183b28"/><stop offset="1" stop-color="#07160f"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#e9ca83" stop-opacity="0"/><stop offset=".5" stop-color="#e9ca83" stop-opacity=".15"/><stop offset="1" stop-color="#e9ca83" stop-opacity="0"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#b3904c" stop-opacity=".55"/><stop offset="1" stop-color="#59472b" stop-opacity=".12"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="stars" width="140" height="130" patternUnits="userSpaceOnUse"><circle cx="18" cy="22" r="1.7" fill="#f1d38d" opacity=".62"/><circle cx="99" cy="57" r="1.2" fill="#e5bd70" opacity=".48"/><circle cx="61" cy="111" r="1.1" fill="#e5bd70" opacity=".42"/></pattern>
</defs>
