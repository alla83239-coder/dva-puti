<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07170f"/><stop offset=".42" stop-color="#163b29"/><stop offset="1" stop-color="#07150f"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ead194" stop-opacity=".75"/><stop offset=".24" stop-color="#cbb071" stop-opacity=".30"/><stop offset="1" stop-color="#cbb071" stop-opacity="0"/></radialGradient>
 <linearGradient id="bark" x2="1"><stop stop-color="#05130c"/><stop offset=".42" stop-color="#173c29"/><stop offset=".75" stop-color="#21482f"/><stop offset="1" stop-color="#07160f"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#c2a16a" stop-opacity=".46"/><stop offset="1" stop-color="#56452a" stop-opacity=".05"/></linearGradient>
 <linearGradient id="ray"><stop stop-color="#edcf8e" stop-opacity="0"/><stop offset=".5" stop-color="#edcf8e" stop-opacity=".12"/><stop offset="1" stop-color="#edcf8e" stop-opacity="0"/></linearGradient>
 <filter id="mist"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" seed="19"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
 <pattern id="glints" width="150" height="145" patternUnits="userSpaceOnUse"><circle cx="22" cy="31" r="1.5" fill="#e7c67d" opacity=".55"/><circle cx="112" cy="81" r="1" fill="#e7c67d" opacity=".45"/><circle cx="70" cy="126" r="1.3" fill="#e7c67d" opacity=".4"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="820" cy="310" rx="480" ry="350" fill="url(#sun)"/>
<circle cx="1090" cy="184" r="72" fill="#ead59b" opacity=".15"/>
<circle cx="1120" cy="157" r="69" fill="#0d291d"/>
